   <g id="text_1">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(39.160458 42.319989)">Raw phase + arrival tables</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(47.819208 54.319989)">25 Hz; 8 spatial blocks</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(42.572333 66.319989)">1,000 channels per block</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(39.317333 78.319989)">Retrospective S references</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(190 43.094989)">Window-local estimation</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(186.036875 54.319989)">Detrend; DPSS tapers; FFT</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(199.170625 66.319989)">Correct fitted phase</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(186.47375 78.319989)">Normalise pairs; lag mean</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(348.425167 43.094989)">Full-route features</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(342.369542 54.319989)">8 blocks x 137 inputs</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(331.704542 66.319989)">Context, noise and powers</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(334.228292 79.094989)">Pick fit + static metadata</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(54.380458 152.363657)">Matched predictors</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(46.909833 164.363657)">Ridge; full-context MLP</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(43.490458 176.363657)">Gated spatial recurrence</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(41.343583 188.363657)">Bidirectional block mixing</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(203.73375 152.363657)">Two output heads</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(189.395 164.363657)">Direct: 8 complex values</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(186.369375 176.363657)">Spectral: 257 probabilities</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(197.114375 188.363657)">Then evaluate 8 lags</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(331.145167 152.363657)">Compare with later targets</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(352.195167 164.363657)">4 bands x 8 lags</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(341.215167 177.138657)">All 32 cells are scored</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(336.842042 188.363657)">No target feature inputs</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(167.77875 266.835273)">Inference and application boundary</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(123.4 278.835273)">Average within earthquake; resample source components</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(127.161875 290.835273)">Bound unseen cross-terms; abstain if sign is unresolved</text>
   </g>
